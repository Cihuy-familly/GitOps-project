apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-csi-provider
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: vault
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vault-csi-provider
      version: "1.4.x"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
      interval: 1h
  values:
    vault:
      address: http://vault-vault-zero:8200