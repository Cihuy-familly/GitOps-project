apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: promtail
      version: "6.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Send logs to Loki — alamat service internal cluster
    config:
      clients:
        - url: http://loki:3100/loki/api/v1/push

      # Scrape config: baca semua container logs dari /var/log/pods
      snippets:
        scrapeConfigs: |
          - job_name: kubernetes-pods
            pipeline_stages:
              # Parse JSON logs untuk structured logging
              - json:
                  expressions:
                    level: level
                    method: method
                    path: path
                    status_code: status_code
                    duration_ms: duration_ms
                    trace_id: trace_id
                    logger: logger
              # Fallback: treat non-JSON logs as raw message
              - logfmt:
                  mapping:
                    level: level
              - labels:
                  level:
                  method:
                  path:
                  trace_id:
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_label_app]
                target_label: app
              - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
                target_label: app
              - source_labels: [__meta_kubernetes_namespace]
                target_label: namespace
              - source_labels: [__meta_kubernetes_pod_container_name]
                target_label: container
              - source_labels: [__meta_kubernetes_pod_name]
                target_label: pod
              - source_labels: [__meta_kubernetes_pod_node_name]
                target_label: node
              # Only keep container stdout/stderr logs
              - source_labels: [__meta_kubernetes_pod_container_id]
                regex: 'container:(.+)'
                replacement: '$1'
                action: replace
                target_label: container_id
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)

    # DaemonSet — 1 pod per node
    # DaemonSet already creates 1 pod per node by default
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Tambah toleration biar bisa jalan di semua node (termasuk control-plane)
    tolerations:
      - operator: Exists
        effect: NoSchedule