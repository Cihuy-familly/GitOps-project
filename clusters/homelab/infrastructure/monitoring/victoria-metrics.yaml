apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.12.x"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: monitoring
      interval: 1h
  values:
    server:
      persistentVolume:
        enabled: true
        size: 50Gi
        storageClassName: local-path
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: 2000m
          memory: 4Gi
      retention: 30d
      service:
        servicePort: 8428
