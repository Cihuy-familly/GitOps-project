apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: victoria-metrics-single
      version: "0.13.0"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    server:
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: local-path
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
      service:
        type: ClusterIP
        port: 8428
      extraArgs:
        promscrape.config: /config/promscrape.yml
      extraVolumes:
        - name: promscrape-config
          configMap:
            name: victoria-metrics-scrape-config
      extraVolumeMounts:
        - name: promscrape-config
          mountPath: /config
    serviceMonitor:
      enabled: true
