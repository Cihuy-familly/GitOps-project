apiVersion: v1
kind: ConfigMap
metadata:
  name: victoria-metrics-scrape-config
  namespace: monitoring
data:
  promscrape.yml: |
    scrape_configs:
      - job_name: 'redis-exporter'
        static_configs:
          - targets: ['redis-exporter.monitoring.svc.cluster.local:9121']

      - job_name: 'demo-order-service'
        scrape_interval: 15s
        metrics_path: /metrics
        static_configs:
          - targets:
              - 'demo-order-service.demo-order.svc.cluster.local:5000'
