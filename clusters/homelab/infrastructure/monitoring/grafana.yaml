apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: grafana
      version: "7.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  values:
    adminUser: admin
    adminPassword: admin123
    persistence:
      enabled: true
      size: 5Gi
      storageClassName: local-path
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            type: prometheus
            url: http://victoria-metrics-server:8428
            access: proxy
            isDefault: true
          - name: Loki
            type: loki
            url: http://loki-gateway:3100
            access: proxy
          - name: Tempo
            type: tempo
            url: http://tempo:3200
            access: proxy
            uid: tempo
            jsonData:
              tracesToLogs:
                datasourceUid: loki
                tags: ['app', 'namespace', 'pod']
                filterByTraceID: true
              nodeGraph:
                enabled: true
              serviceMap:
                datasourceUid: VictoriaMetrics
    # Dashboard sidecar — auto-discover ConfigMaps with grafana_dashboard label
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        searchNamespace: ALL
      datasources:
        enabled: false
    service:
      type: ClusterIP
      port: 3000
