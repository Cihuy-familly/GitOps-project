apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmagent
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: victoria-metrics-agent
      version: "0.10.x"
      sourceRef:
        kind: HelmRepository
        name: victoria-metrics
        namespace: monitoring
      interval: 1h
  values:
    remoteWriteUrls:
      - "http://victoria-metrics-victoria-metrics-single-server:8428/api/v1/write"
    config:
      global:
        scrape_interval: 15s
      scrape_configs:
        # Scrape quiz-vote services directly by service name
        - job_name: 'quiz-vote-frontend'
          static_configs:
            - targets: ['frontend.quiz-vote.svc:5000']
          metrics_path: /metrics
        - job_name: 'quiz-vote-vote-api'
          static_configs:
            - targets: ['vote-api.quiz-vote.svc:8000']
          metrics_path: /metrics
        - job_name: 'quiz-vote-result-api'
          static_configs:
            - targets: ['result-api.quiz-vote.svc:8001']
          metrics_path: /metrics
        # Kubernetes service endpoints with annotations
        - job_name: 'kubernetes-service-endpoints'
          kubernetes_sd_configs:
            - role: endpoints
          relabel_configs:
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
              action: replace
              target_label: __scheme__
              regex: (https?)
            - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
              action: replace
              target_label: __address__
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_service_name]
              action: replace
              target_label: service
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
