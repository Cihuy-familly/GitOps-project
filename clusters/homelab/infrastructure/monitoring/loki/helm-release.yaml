apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: loki
      version: "6.x"  # Loki v3 single binary
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Single binary mode — 1 pod for all Loki components
    # Cocok untuk homelab (resource terbatas)
    loki:
      commonConfig:
        replication_factor: 1
      auth_enabled: false  # No auth for internal cluster
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

    # File system storage (bukan S3/GCS)
    storage:
      type: filesystem
      bucketNames:
        chunks: loki-chunks
        ruler: loki-ruler
        admin: loki-admin

    # Single binary = 1 pod, 1 PVC
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 10Gi
        storageClassName: local-path

    # Resource limits — ringan untuk homelab
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 512Mi

    # Service — NodePort for manual debugging
    service:
      port: 3100
      type: NodePort
      nodePort: 30100

    # Monitoring
    monitoring:
      selfMonitoring:
        enabled: false  # Reduce resource usage
      serviceMonitor:
        enabled: false

    # Chunk retention — hapus data > 7 hari
    chunkStoreConfig:
      chunkRetention:
        enabled: true
        period: 168h  # 7 days
    compactor:
      retention_enabled: true
      retention_delete_delay: 2h