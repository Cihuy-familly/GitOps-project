apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tempo
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: tempo
      version: "1.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
      interval: 1h
  values:
    tempo:
      repository: grafana/tempo
      tag: latest
    persistence:
      enabled: true
      size: 20Gi
      storageClassName: local-path
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
    service:
      type: ClusterIP
      ports:
        http: 3200
        otlp-http: 4318
        otlp-grpc: 4317
