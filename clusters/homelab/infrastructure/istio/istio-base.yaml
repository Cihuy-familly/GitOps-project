apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: istio-system
spec:
  interval: 1m
  releaseName: istio-base
  chart:
    spec:
      chart: base
      version: "1.30.x"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 1m
  values:
    defaultRevision: default
    global:
      istioNamespace: istio-system
    base:
      enableIstioConfigCRDs: true