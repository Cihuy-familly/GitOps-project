apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-istiod
  namespace: istio-system
spec:
  interval: 1m
  releaseName: istiod
  dependsOn:
    - name: istio-base
  chart:
    spec:
      chart: istiod
      version: "1.23.x"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: flux-system
      interval: 1m
  values:
    global:
      istioNamespace: istio-system
      hub: docker.io/istio
      tag: 1.23.2
      proxy:
        autoInject: enabled
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        logLevel: warning

    pilot:
      autoscaleEnabled: false
      replicaCount: 1
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          memory: 1Gi
      enableProtocolSniffingForOutbound: true
      enableProtocolSniffingForInbound: true
      traceSampling: 1.0

    meshConfig:
      enablePrometheusMerge: true
      accessLogFile: /dev/stdout
      defaultConfig:
        proxyMetadata: {}
      trustDomain: cluster.local

    sidecarInjectorWebhook:
      rewriteAppHTTPProbe: true
      enableNamespacesByDefault: false