apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: vault
  install:
    createNamespace: true
  chart:
    spec:
      chart: vault
      version: "0.28.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    server:
      # to disable Dev mode
      dev:
        enabled: false

      # Adding persintance storage
      dataStorage:
	enabled: true
	size: 5Gi
	storageClass: local-path
      
      # standalonemod mode for singgle pod
      standalone:
	enabled: true
     
      # file base storage backend
      storage:
	file:
	  path: /vault/data
	
      # enable UI 
      ui:
	enabled: true
