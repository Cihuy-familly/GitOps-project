apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: vault
  install:
    createNamespace: true
  chart:
    spec:
      chart: vault
      version: "0.28.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
  values:
    server:
      dev:
        enabled: false
      dataStorage:
        enabled: true
        size: 5Gi
        storageClass: local-path
      standalone:
        enabled: true
      storage:
        file:
          path: /vault/data
      ui:
        enabled: true
      service:
        type: NodePort
        port: 8200
        nodePort: 30200
