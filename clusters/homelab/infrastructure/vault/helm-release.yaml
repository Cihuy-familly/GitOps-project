apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault-zero
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: vault
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: vault
      version: "0.28.1"
      sourceRef:
        kind: HelmRepository
        name: hashicorp
        namespace: flux-system
      interval: 1h
  values:
    csi:
      enabled: true
    server:
      standalone:
        enabled: true
      dataStorage:
        enabled: true
        size: 10Gi
        storageClass: null
        accessMode: ReadWriteOnce
      auditStorage:
        enabled: true
        size: 10Gi
        storageClass: null
        accessMode: ReadWriteOnce
      ui:
        enabled: true
      service:
        type: NodePort
        port: 8200
        nodePort: 30200