apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: myapp-spc
  namespace: vault-csi-test
spec:
  provider: vault
  parameters:
    vaultAddress: "http://vault-vault-zero.vault.svc:8200"
    roleName: "myapp-role"
    objects: |
      - objectName: "username"
        objectPath: "secret/data/myapp"
        objectVersion: ""
      - objectName: "password"
        objectPath: "secret/data/myapp"
        objectVersion: ""