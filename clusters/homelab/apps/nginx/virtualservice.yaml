apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: sandbox-vs
  namespace: default
spec:
  hosts:
    - "cihuylabs.my.id"
    - "portfolio.cihuylabs.my.id"
    - "demo.cihuylabs.my.id"
  gateways:
    - sandbox-gateway
  http:
    - match:
        - authority:
            prefix: portfolio.
      route:
        - destination:
            host: portfolio.portfolio.svc.cluster.local
            port:
              number: 3013
    - match:
        - authority:
            exact: cihuylabs.my.id
      route:
        - destination:
            host: cihuylabs-landing.cihuylabs-landing.svc.cluster.local
            port:
              number: 80
    - match:
        - authority:
            prefix: demo.
      route:
        - destination:
            host: demo-order-service.demo-order.svc.cluster.local
            port:
              number: 5000
    # Note: catch-all wildcard route removed.
    # All subdomains must be explicitly listed in hosts and matched above.