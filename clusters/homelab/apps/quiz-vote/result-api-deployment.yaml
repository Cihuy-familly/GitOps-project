apiVersion: apps/v1
kind: Deployment
metadata:
  name: result-api
  namespace: quiz-vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result-api
  template:
    metadata:
      labels:
        app: result-api
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: result-api
          image: registry.cihuyproject.my.id/quiz-vote/result-api:1.0.0
          ports:
            - containerPort: 8001
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: OTEL_SERVICE_NAME
              value: "result-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: quiz-vote-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: ARTIFICIAL_DELAY_MS
              valueFrom:
                configMapKeyRef:
                  name: quiz-vote-config
                  key: ARTIFICIAL_DELAY_MS
            - name: ERROR_RATE
              valueFrom:
                configMapKeyRef:
                  name: quiz-vote-config
                  key: ERROR_RATE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10