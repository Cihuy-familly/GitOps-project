apiVersion: apps/v1
kind: Deployment
metadata:
  name: vote-api
  namespace: quiz-vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote-api
  template:
    metadata:
      labels:
        app: vote-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      imagePullSecrets:
        - name: registry-credentials
      containers:
        - name: vote-api
          image: registry.cihuyproject.my.id/quiz-vote/vote-api:1.0.0
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: quiz-vote-config
                  key: REDIS_URL
            - name: OTEL_SERVICE_NAME
              value: "vote-api"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: quiz-vote-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: ARTIFICIAL_DELAY_MS
              valueFrom:
                configMapKeyRef:
                  name: quiz-vote-config
                  key: ARTIFICIAL_DELAY_MS
            - name: ERROR_RATE
              valueFrom:
                configMapKeyRef:
                  name: quiz-vote-config
                  key: ERROR_RATE
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
