apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-alerting-config
  namespace: monitoring
data:
  alerting.yaml: |
    apiVersion: 1

    contactPoints:
      - orgId: 1
        name: Discord
        receivers:
          - uid: discord-webhook
            type: discord
            settings:
              url: "https://discord.com/api/webhooks/1547069230808301670/LK5J3SCU0Fkam6NUaxYWgCLWmGJYcecp0NEsO3h_TQNwyabcdnXr3rseWwuhQptFSJG9"
              message: "{{ template \"default.message\" . }}"

    policies:
      - orgId: 1
        receiver: Discord
        group_by:
          - grafana_folder
          - alertname
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        routes:
          - receiver: Discord
            matchers:
              - severity = critical
            group_wait: 10s
            repeat_interval: 1h
          - receiver: Discord
            matchers:
              - severity = warning
            group_wait: 30s
            repeat_interval: 4h
          - receiver: Discord
            matchers:
              - severity = info
            group_wait: 1m
            repeat_interval: 24h

    groups:
      - orgId: 1
        name: Redis Alerts
        folder: Redis
        interval: 1m
        rules:
          - uid: redis-down
            title: Redis Down
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  expr: redis_up
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 432000
                  reducer: last
                  refId: B
                  type: reduce
            noDataState: Alerting
            execErrState: Error
            for: 1m
            annotations:
              description: Redis instance is down
              summary: Redis is not responding
            labels:
              severity: critical

          - uid: redis-memory-high
            title: Redis Memory Usage High
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  expr: redis_used_memory / redis_mem_fragmentation_ratio
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 180000000
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 432000
                  reducer: last
                  refId: B
                  type: reduce
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              description: Redis memory usage is high
              summary: Redis memory usage exceeds threshold
            labels:
              severity: warning

          - uid: redis-clients-high
            title: Redis Connected Clients High
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  expr: redis_connected_clients
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 100
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 432000
                  reducer: last
                  refId: B
                  type: reduce
            noDataState: OK
            execErrState: Error
            for: 5m
            annotations:
              description: Redis has more than 100 connected clients
              summary: High number of connected clients
            labels:
              severity: warning

          - uid: redis-evicted-keys
            title: Redis Evicted Keys
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  expr: increase(redis_evicted_keys_total[5m])
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 432000
                  reducer: last
                  refId: B
                  type: reduce
            noDataState: OK
            execErrState: Error
            for: 1m
            annotations:
              description: Redis is evicting keys due to memory pressure
              summary: Keys are being evicted
            labels:
              severity: warning

          - uid: redis-rejected-connections
            title: Redis Rejected Connections
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: victoriametrics
                model:
                  expr: increase(redis_rejected_connections_total[5m])
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 300
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 432000
                  reducer: last
                  refId: B
                  type: reduce
            noDataState: OK
            execErrState: Error
            for: 1m
            annotations:
              description: Redis is rejecting connections
              summary: Connection rejections detected
            labels:
              severity: critical

          - uid: redis-restart
            title: Redis Restarted
            condition: B
            data:
              - refId: A
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: victoriametrics
                model:
                  expr: changes(redis_uptime_in_seconds[10m])
                  instant: true
                  intervalMs: 1000
                  maxDataPoints: 43200
                  refId: A
              - refId: B
                relativeTimeRange:
                  from: 600
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - B
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    type: __expr__
                    uid: __expr__
                  expression: A
                  intervalMs: 1000
                  maxDataPoints: 432000
                  reducer: last
                  refId: B
                  type: reduce
            noDataState: OK
            execErrState: Error
            for: 1m
            annotations:
              description: Redis instance has restarted
              summary: Redis restart detected
            labels:
              severity: info
