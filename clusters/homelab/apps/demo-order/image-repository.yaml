---
# ImageRepository — watches the Docker registry for new image tags
# Flux checks every 1 minute for new tags
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageRepository
metadata:
  name: demo-order-service
  namespace: flux-system
spec:
  image: registry.cihuyproject.my.id/demo-order-service
  interval: 1m
  # If registry requires auth, create a K8s secret and reference it:
  # secretRef:
  #   name: registry-credentials
---
# ImagePolicy — picks the latest tag matching the semver pattern
# Tag format: main-<sha>-<timestamp> (e.g., main-579c4d8-260725065335)
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: demo-order-service
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: demo-order-service
  filterTags:
    pattern: ^main-[a-f0-9]+-\d{12}$
    # Filter: hanya tag dari branch "main" dengan format <sha>-<timestamp>
  policy:
    alphabetical:
      order: asc
    # Ambil tag terakhir secara alphabetical — karena timestamp di akhir,
    # tag terbaru akan terpilih secara natural.